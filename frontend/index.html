```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header>
        <h1>Face Tracker</h1>
        <div class="status">
            <span class="dot"></span>
            Connected
        </div>
    </header>

    <main>

        <section class="left">

            <div class="camera-card">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>

                <div class="fps" id="fps">
                    FPS: 0
                </div>
            </div>

            <div class="panel">
                <h2>Live Detection</h2>
                <ul id="faceList"></ul>
            </div>

        </section>

        <aside>

            <div class="panel">
                <h2>Camera</h2>
                <button id="startBtn">Start Camera</button>
            </div>

            <div class="panel">
                <h2>Enrollment</h2>

                <input
                    id="personName"
                    type="text"
                    placeholder="Enter name"
                >

                <button id="enrollBtn">
                    Start Enroll
                </button>

                <div id="enrollStatus">
                    Idle
                </div>
            </div>

            <div class="panel">
                <h2>Model</h2>

                <button id="trainBtn">
                    Train Model
                </button>

                <button id="reloadBtn">
                    Refresh People
                </button>
            </div>

            <div class="panel">
                <h2>People</h2>
                <ul id="peopleList"></ul>
            </div>

        </aside>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
```
